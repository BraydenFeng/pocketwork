name: Pocketwork
options:
  bundleIdPrefix: com.braydenfeng
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: W9DZ99R2NS
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    APP_GROUP: group.com.braydenfeng.pocketwork
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  Pocketwork:
    type: application
    platform: iOS
    sources:
      - path: Pocketwork
        excludes: [Info.plist, Pocketwork.entitlements]
      - Shared
      - path: ../public/starter.pocketwork.json
        buildPhase: resources
      - path: ../public/routines.pocketwork.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.braydenfeng.pocketwork
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Pocketwork/Info.plist
      properties:
        CFBundleDisplayName: Pocketwork
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: "1.0"
        SupabaseURL: $(SUPABASE_URL)
        SupabaseAnonKey: $(SUPABASE_ANON_KEY)
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLSchemes: [com.braydenfeng.pocketwork]
        UILaunchScreen: {}
        PocketworkAppGroup: $(APP_GROUP)
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIFileSharingEnabled: false
        LSSupportsOpeningDocumentsInPlace: true
    entitlements:
      path: Pocketwork/Pocketwork.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - $(APP_GROUP)
    dependencies:
      - target: FocusMonitor
        embed: true
    scheme:
      testTargets: [PocketworkTests, PocketworkUITests]
  FocusMonitor:
    type: app-extension
    platform: iOS
    sources:
      - path: FocusMonitor
        excludes: [Info.plist, FocusMonitor.entitlements]
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.braydenfeng.pocketwork.FocusMonitor
        APPLICATION_EXTENSION_API_ONLY: true
    info:
      path: FocusMonitor/Info.plist
      properties:
        CFBundleDisplayName: Pocketwork Focus Monitor
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: "1.0"
        PocketworkAppGroup: $(APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).FocusMonitor
    entitlements:
      path: FocusMonitor/FocusMonitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - $(APP_GROUP)
  PocketworkTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PocketworkTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: Pocketwork
  PocketworkUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [PocketworkUITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: Pocketwork
    dependencies:
      - target: Pocketwork
