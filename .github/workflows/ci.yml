name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      ios:
        description: "Also build and test the iPhone app (macOS minutes cost money)"
        type: boolean
        default: true

# A new push to the same branch cancels the run before it, so nobody pays for a build of code that is already stale.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web editor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run verify:ui
      - run: npx next build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          PLAYWRIGHT_CHANNEL: chromium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-screenshots
          path: test-results/*.png
          if-no-files-found: ignore

  ios:
    # Compiles the SwiftUI host and runs its XCTests on a simulator. No signing, so Screen Time is not exercised here.
    # macOS minutes are billed at 10x, so this only runs on demand: the Run workflow button, or a commit message containing [ios].
    name: iPhone app
    if: github.event_name == 'workflow_dispatch' && inputs.ios || contains(github.event.head_commit.message, '[ios]')
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: ios
        run: xcodegen generate
      - name: Pick a simulator
        id: sim
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -E "iPhone (1[5-9]|[2-9][0-9])" | head -n 1 | sed -E 's/^ *([^(]+) \(.*/\1/' | xargs)
          echo "Using simulator: $DEVICE"
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"
      - name: Build and test (unit tests, then a UI walkthrough that saves screenshots)
        working-directory: ios
        env:
          TEST_RUNNER_SCREENSHOT_DIR: ${{ github.workspace }}/ios/screenshots
        run: |
          set -o pipefail
          mkdir -p screenshots
          xcodebuild test \
            -project Pocketwork.xcodeproj \
            -scheme Pocketwork \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee xcodebuild.log | grep -E "error:|Test Suite|Test Case|BUILD|TEST" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" xcodebuild.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iphone-screenshots
          path: ios/screenshots/*.png
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xcodebuild-log
          path: ios/xcodebuild.log
