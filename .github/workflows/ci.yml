name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  web:
    name: Web editor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run verify:ui
      - run: npx next build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          PLAYWRIGHT_CHANNEL: chromium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-screenshots
          path: test-results/*.png
          if-no-files-found: ignore

  ios:
    # Compiles the SwiftUI host and runs its XCTests on a simulator. No signing, so Screen Time is not exercised here.
    name: iPhone app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: ios
        run: xcodegen generate
      - name: Pick a simulator
        id: sim
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -E "iPhone (1[5-9]|[2-9][0-9])" | head -n 1 | sed -E 's/^ *([^(]+) \(.*/\1/' | xargs)
          echo "Using simulator: $DEVICE"
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"
      - name: Build and test
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild test \
            -project Pocketwork.xcodeproj \
            -scheme Pocketwork \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee xcodebuild.log | grep -E "error:|warning: unused|Test Suite|Test Case|passed|failed|BUILD|TEST" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" xcodebuild.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xcodebuild-log
          path: ios/xcodebuild.log
