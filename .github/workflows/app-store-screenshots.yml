name: App Store screenshots

# Captures App Store screenshots on the largest iPhone (6.9-inch) and iPad (13-inch) simulators. Run on demand; macOS minutes cost money.
on:
  workflow_dispatch:

jobs:
  screenshots:
    name: ${{ matrix.name }} screenshots
    runs-on: macos-15
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 6.9-inch iPhone
            device: "iPhone 1[6-9] Pro Max"
            artifact: app-store-screenshots
          - name: 13-inch iPad
            device: "iPad Pro 13-inch"
            artifact: app-store-screenshots-ipad
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: ios
        run: xcodegen generate
      - name: Boot the simulator with a clean status bar
        id: sim
        run: |
          set -euo pipefail
          LINE=$(xcrun simctl list devices available | grep -E "${{ matrix.device }} \(" | head -n 1)
          test -n "$LINE" || { echo "No ${{ matrix.name }} simulator on this runner"; xcrun simctl list devices available; exit 1; }
          UDID=$(echo "$LINE" | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          echo "Using: $LINE"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --dataNetwork wifi --wifiMode active --wifiBars 3 --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Capture screenshots
        working-directory: ios
        env:
          TEST_RUNNER_APP_STORE_SCREENSHOTS: "1"
          TEST_RUNNER_SCREENSHOT_DIR: ${{ github.workspace }}/ios/app-store-screenshots
        run: |
          set -o pipefail
          mkdir -p app-store-screenshots
          xcodebuild test \
            -project Pocketwork.xcodeproj \
            -scheme Pocketwork \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -only-testing:PocketworkUITests/AppStoreScreenshots \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee screenshots.log | grep -E "error:|Test Case|BUILD|TEST" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" screenshots.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.artifact }}
          path: |
            ios/app-store-screenshots/*.png
            ios/screenshots.log
          if-no-files-found: ignore
